# book-translate-ru — пользовательская конфигурация
#
# Этот файл переопределяет стандартные настройки скриптов скилла.
# Скопируй его в рабочую директорию (рядом с <книга>_temp/) и правь
# под конкретную книгу. Если config.toml не найден — используются
# значения по умолчанию из скриптов.
#
# Все пути — относительно рабочей директории, в которой запускается
# пайплайн (где лежит <книга>_temp/).

# ─────────────────────────────────────────────────────────────────────
# Чанкование (convert.py)
# ─────────────────────────────────────────────────────────────────────
[chunking]
# Целевой размер чанка в символах. Скрипт старается не превышать это
# значение, но не режет абзацы — большой абзац может уйти целиком.
# 30000 ≈ 7500 токенов источника + 10000 токенов перевода = ~17500 токенов
# на чанк. Хорошо для субагентов с контекстом 100-150k токенов.
chunk_size = 30000

# Жёсткий предел: абзацы длиннее этого режутся по предложениям.
# Должен быть >= chunk_size.
soft_limit = 40000

# Минимальный размер чанка. Чанки короче этого — признак плохого
# разбиения (короткий хвост главы). convert.py выводит warning.
min_chunk = 200

# Режим "только по главам": если true — convert.py НЕ режет главы на
# части, даже если глава длиннее chunk_size. Один чанк = одна глава
# (H1/H2). Это РЕКОМЕНДУЕМЫЙ режим по умолчанию для художественной
# прозы — сохраняет целостность главы для контекста субагента.
# Если главы очень длинные (>50000 символов) — переключи на false,
# тогда главы будут резаться по ~30000 символов (см. chunk_size).
chapter_only = true

# ─────────────────────────────────────────────────────────────────────
# Neighbor context (chunk_context.py)
# ─────────────────────────────────────────────────────────────────────
[chunk_context]
# Сколько символов prev/next chunk'а инъецировать субагенту для
# разрешения местоимений и ссылок. 300 — эмпирический баланс:
# меньше — теряется контекст; больше — leak'ает перевод в вывод.
context_chars = 300

# ─────────────────────────────────────────────────────────────────────
# Глоссарий (glossary.py)
# ─────────────────────────────────────────────────────────────────────
[glossary]
# Сколько топ-N самых частых терминов включать в per-chunk таблицу,
# даже если они не встречаются в этом чанке.
high_frequency_top_n = 20

# ─────────────────────────────────────────────────────────────────────
# Контроль качества (glossary.py validate-manifest, quality_check.py)
# ─────────────────────────────────────────────────────────────────────
[quality]
# Допустимое соотношение длины перевода к оригиналу.
# Вне этого диапазона — warning (или error с --strict).
ratio_min = 0.6
ratio_max = 2.0

# Минимальная длина непереведённого ASCII-рана, который считается
# "english leak". 80 символов ≈ 15-20 слов.
en_leak_chars = 80

# ─────────────────────────────────────────────────────────────────────
# Эпиграфы и сноски (detect_epigraphs.py)
# ─────────────────────────────────────────────────────────────────────
[epigraphs]
# Максимальная длина блока текста перед заголовком, который считается
# эпиграфом. Блоки длиннее — обычно содержимое предыдущей главы.
epigraph_max_chars = 600

# ─────────────────────────────────────────────────────────────────────
# Сверка местоимений (pronoun_check.py)
# ─────────────────────────────────────────────────────────────────────
[pronoun_check]
# Сколько символов каждого переведённого чанка передавать субагенту
# как evidence. 800 — баланс между достаточным контекстом и размером
# payload.
snippet_chars = 800

# Когда общий payload > 50k символов — обрезаем snippet до этого размера.
snippet_truncate = 200

# И берём только первые N чанков в truncated-режиме.
snippet_limit = 20

# ─────────────────────────────────────────────────────────────────────
# Пост-мортем (post_mortem.py)
# ─────────────────────────────────────────────────────────────────────
[post_mortem]
# Если общий payload больше этого — агрегируем per-chunk данные в
# counts (severity/category), не передаём полные meta/qa.
aggregate_threshold = 80000

# ─────────────────────────────────────────────────────────────────────
# Retry-политика (шаг 5d в references/phase-2-translate.md)
# ─────────────────────────────────────────────────────────────────────
[retry]
# Минимальный размер output_chunkNNNN.md. Меньше — считается пустым,
# триггерит retry.
min_output_chars = 100

# Максимум retry-попыток на чанк. После этого — mark-failed.
max_retries = 2

# ─────────────────────────────────────────────────────────────────────
# Контракт завершения polish (шаг 8b.1 в references/phase-3-finish.md)
# ─────────────────────────────────────────────────────────────────────
[polish]
# Допустимый ratio длины polish-вывода к исходному output_chunk.
# Вне диапазона — polish_failed, восстановить .bak.
ratio_min = 0.5
ratio_max = 2.0

# Максимальное изменение числа заголовков (# / ##) в polish-выводе.
# |delta| > это → polish_failed.
max_heading_delta = 2

# ─────────────────────────────────────────────────────────────────────
# Параллелизм (шаг 5b в references/phase-2-translate.md)
# ВАЖНО: batch_size — рекомендация для оркестратора, не используется
# скриптами автоматически. Оркестратор читает это значение из вывода
# run_state.py plan и группирует чанки соответственно.
[parallelism]
batch_size = 4
